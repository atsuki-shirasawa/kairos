<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Kairos</title>
  <!-- The Kairos mark: a circle in the time column's "dawn → dusk → night" colors, cut by a
       diagonal blade. Kairos, god of the opportune moment, is said to stand on a razor's edge;
       the cut stands for seizing that moment -->
  <defs>
    <linearGradient id="g" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c4d0ea"/>
      <stop offset="0.55" stop-color="#efc98a"/>
      <stop offset="1" stop-color="#3a4a7c"/>
    </linearGradient>
    <clipPath id="l"><path d="M0 0H19L11 32H0Z"/></clipPath>
    <clipPath id="r"><path d="M21.6 0H32V32H13.6Z"/></clipPath>
  </defs>
  <g clip-path="url(#l)"><circle cx="15.2" cy="16" r="14" fill="url(#g)"/></g>
  <g clip-path="url(#r)"><circle cx="16.8" cy="16" r="14" fill="url(#g)"/></g>
</svg>
